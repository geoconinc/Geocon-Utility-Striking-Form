[build]
  publish = "."
  functions = "netlify/functions"
  # Don't fail build when these env var *values* appear in repo (e.g. docs/examples). Real secret is SMTP_PASS.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,EMAIL_TO,PORT"

[functions]
  node_bundler = "esbuild"

# Injury and offensive behavior forms only. The utility strike form posts
# straight to /.netlify/functions/submit and is unaffected by this rewrite.
[[redirects]]
  from = "/api/submit-report"
  to = "/.netlify/functions/submit-report"
  status = 200
